name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin
        run: claude plugin validate --strict plugins/earthspoken
      - name: Validate lite plugin
        run: claude plugin validate --strict plugins/earthspoken-lite
      - name: Check versions match
        run: |
          for p in earthspoken earthspoken-lite; do
            a=$(jq -r .version plugins/$p/.claude-plugin/plugin.json)
            b=$(jq -r --arg p "$p" '.plugins[] | select(.name == $p) | .version' .claude-plugin/marketplace.json)
            [ "$a" = "$b" ] || { echo "$p: plugin.json $a != marketplace.json $b"; exit 1; }
          done
      - name: Check helper-agent context is valid JSON
        run: jq -e .hookSpecificOutput.additionalContext plugins/earthspoken/rules/subagent-context.json
