name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin
        run: claude plugin validate --strict plugins/earthspoken
      - name: Check versions match
        run: |
          a=$(jq -r .version plugins/earthspoken/.claude-plugin/plugin.json)
          b=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          [ "$a" = "$b" ] || { echo "plugin.json $a != marketplace.json $b"; exit 1; }
      - name: Check helper-agent context is valid JSON
        run: jq -e .hookSpecificOutput.additionalContext plugins/earthspoken/rules/subagent-context.json
